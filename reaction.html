<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Test · DuelZone</title>
  <meta name="description" content="Play Reaction Test on DuelZone — Test your reflexes! Tap when the screen turns green." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="duelzone.css" />
  <style>
    .hidden { display: none !important; }

    .dz-setup-page .dz-setup-wrap {
      display: flex; flex-direction: column; gap: 14px;
      width: 100%; max-width: 400px; margin: 0 auto; padding: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif; color: var(--dz-text-primary);
    }
    .dz-hero-heading {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #22c55e, #10b981, #14b8a6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .rx-section-title {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: var(--dz-text-secondary);
    }
    .rx-round-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .rx-round-card {
      background: var(--dz-bg-card); border: 2px solid var(--dz-border);
      border-radius: var(--dz-radius-md); padding: 14px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; transition: all var(--dz-transition); text-align: center;
    }
    .rx-round-card:hover { border-color: var(--dz-border-light); transform: translateY(-2px); }
    .rx-round-card.selected { border-color: #22c55e; box-shadow: 0 0 12px rgba(34,197,94,0.2); }
    .rx-round-name { font-size: 13px; font-weight: 700; }

    .dz-toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; border-bottom: 1.5px solid var(--dz-border);
    }
    .dz-toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
    .dz-toggle input { opacity: 0; width: 0; height: 0; }
    .dz-toggle-track {
      position: absolute; cursor: pointer; inset: 0;
      background-color: var(--dz-border); transition: .3s; border-radius: 24px;
    }
    .dz-toggle-track:before {
      position: absolute; content: ""; height: 16px; width: 16px;
      left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%;
    }
    .dz-toggle input:checked + .dz-toggle-track { background-color: #22c55e; }
    .dz-toggle input:checked + .dz-toggle-track:before { transform: translateX(20px); }

    .rx-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      width: 100%; max-width: 400px; margin: 0 auto; padding: 16px; user-select: none;
    }
    .rx-hud {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      background: var(--dz-bg-card); border: 1px solid var(--dz-border);
      padding: 10px 18px; border-radius: var(--dz-radius-md); font-weight: 800; font-size: 13px;
    }
    .rx-zone {
      width: 100%; aspect-ratio: 1; border-radius: 24px;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px;
      cursor: pointer; transition: background-color 0.15s;
      font-size: 22px; font-weight: 800; color: #fff; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .rx-zone.waiting { background: #ef4444; }
    .rx-zone.ready { background: #22c55e; }
    .rx-zone.early { background: #f59e0b; }
    .rx-zone-sub { font-size: 13px; font-weight: 500; opacity: 0.8; }
    .rx-results-list {
      width: 100%; display: flex; flex-direction: column; gap: 6px;
    }
    .rx-result-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 14px; background: var(--dz-bg-card); border: 1px solid var(--dz-border);
      border-radius: var(--dz-radius-sm); font-size: 13px; font-weight: 600;
    }
  </style>
</head>
<body>
<div class="dz-app">
  <header class="dz-topbar">
    <a class="dz-icon-btn" id="dz-back-hub" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="dz-logo" style="font-size:17px;">Reaction Test</span>
    <div class="dz-topbar-actions">
      <button class="dz-icon-btn" id="dz-restart" type="button" aria-label="Restart">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-5"/></svg>
      </button>
      <button class="dz-theme-toggle" id="themeToggle" type="button">
        <svg id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="5"/></svg>
      </button>
    </div>
  </header>

  <div id="rx-setup">
    <div class="dz-setup-page dz-setup-wrap">
      <p class="dz-hero-eyebrow">Reaction Test</p>
      <h2 class="dz-hero-heading">Lightning Reflexes</h2>
      <p style="color:var(--dz-text-secondary);font-size:13px;margin-bottom:12px;">Wait for green, then tap as fast as you can!</p>

      <div class="rx-section-title">Rounds</div>
      <div class="rx-round-cards">
        <div class="rx-round-card" data-rounds="3">
          <span class="rx-round-name">3 Rounds</span>
        </div>
        <div class="rx-round-card selected" data-rounds="5">
          <span class="rx-round-name">5 Rounds</span>
        </div>
        <div class="rx-round-card" data-rounds="10">
          <span class="rx-round-name">10 Rounds</span>
        </div>
      </div>

      <div class="rx-section-title" style="margin-top:16px;">Settings</div>
      <div class="dz-toggle-row">
        <span style="font-size:14px;font-weight:600">Audio FX</span>
        <label class="dz-toggle">
          <input type="checkbox" checked id="rx-sound-toggle">
          <span class="dz-toggle-track"></span><span class="dz-toggle-thumb"></span>
        </label>
      </div>

      <button class="dz-btn dz-btn-primary" id="rx-start-btn" type="button"
              style="margin-top:20px;width:100%;border-radius:var(--dz-radius-xl);font-size:14px;font-weight:700;">
        TEST REFLEXES ⚡
      </button>
    </div>
  </div>

  <div id="rx-play" class="hidden">
    <div id="rx-game-area"></div>
  </div>
</div>

<div id="dz-result-overlay">
  <div class="dz-result-page" style="max-width:320px;">
    <div class="dz-result-trophy">⚡</div>
    <h2 class="dz-result-heading" id="dz-result-title">Results!</h2>
    <p class="dz-result-subtitle" id="dz-result-sub"></p>
    <div class="dz-result-actions">
      <button class="dz-btn dz-btn-primary" id="dz-result-again" type="button">TRY AGAIN</button>
      <button class="dz-btn dz-btn-secondary" id="dz-result-share" type="button">SHARE</button>
    </div>
    <a class="dz-see-all" href="index.html" style="margin-top:8px;display:block;">← Back to Hub</a>
  </div>
</div>

<script src="dz-games.js"></script>
<script src="dz-theme.js"></script>
<script src="dz-core.js"></script>
<script src="dz-game-shell.js"></script>
<script src="games/reaction.js"></script>
<script src="dzshare.js"></script>

<script>
(function() {
  'use strict';
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.rx-round-card').forEach(function(card) {
      card.addEventListener('click', function() {
        document.querySelectorAll('.rx-round-card').forEach(function(c) { c.classList.remove('selected'); });
        card.classList.add('selected');
      });
    });

    var setup = document.getElementById('rx-setup');
    var play = document.getElementById('rx-play');
    var area = document.getElementById('rx-game-area');
    var instance = null;

    document.getElementById('rx-start-btn').addEventListener('click', function() {
      var roundCard = document.querySelector('.rx-round-card.selected');
      var rounds = roundCard ? parseInt(roundCard.dataset.rounds) : 5;
      var sound = document.getElementById('rx-sound-toggle').checked;

      setup.classList.add('hidden');
      play.classList.remove('hidden');
      if (instance && instance.stop) instance.stop();

      setTimeout(function() {
        try {
          if (window.DZGames && window.DZGames['reaction']) {
          instance = window.DZGames['reaction']({
            container: area,
            rounds: rounds,
            sound: sound,
            onEnd: function(r) {
              if (typeof dzShowResult === 'function') {
                dzShowResult({
                  title: 'Results!',
                  subtitle: r.subtitle || 'Reaction Test Complete',
                  onAgain: function() {
                    if (typeof dzHideResult === 'function') dzHideResult();
                    play.classList.add('hidden');
                    setup.classList.remove('hidden');
                  }
                });
              }
            }
          });
          } else {
            area.innerHTML = '<div style="color:#ff4444; padding:20px; font-family:sans-serif; text-align:center;">Error: Game script not found or failed to load.</div>';
          }
        } catch (err) {
          area.innerHTML = '<div style="color:#ff4444; padding:20px; font-family:sans-serif; text-align:center;">Error: ' + err.message + '</div>';
        }
      }, 60);
    });

    document.getElementById('dz-restart').addEventListener('click', function() {
      if (instance && instance.stop) instance.stop();
      if (typeof dzHideResult === 'function') dzHideResult();
      play.classList.add('hidden');
      setup.classList.remove('hidden');
    });

    if (typeof dzInitGamePage === 'function') dzInitGamePage({});
  });
})();
</script>
</body>
</html>
