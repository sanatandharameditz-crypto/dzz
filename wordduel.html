<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Duel · DuelZone</title>
  <meta name="description" content="Play Word Duel on DuelZone — Race to type words faster than your opponent!" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />
  <link rel="stylesheet" href="duelzone.css" />
  <style>
    .hidden { display: none !important; }

    .dz-setup-page .dz-setup-wrap {
      display: flex; flex-direction: column; gap: 14px;
      width: 100%; max-width: 400px; margin: 0 auto; padding: 16px;
      font-family: 'Plus Jakarta Sans', sans-serif; color: var(--dz-text-primary);
    }
    .dz-hero-heading {
      font-size: 28px; font-weight: 800;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa, #c4b5fd);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .wd-section-title {
      font-size: 11px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: var(--dz-text-secondary);
    }
    .wd-diff-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .wd-diff-card {
      background: var(--dz-bg-card); border: 2px solid var(--dz-border);
      border-radius: var(--dz-radius-md); padding: 14px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; transition: all var(--dz-transition); text-align: center;
    }
    .wd-diff-card:hover { border-color: var(--dz-border-light); transform: translateY(-2px); }
    .wd-diff-card.selected { border-color: #8b5cf6; box-shadow: 0 0 12px rgba(139,92,246,0.2); }
    .wd-diff-emoji { font-size: 22px; }
    .wd-diff-name { font-size: 13px; font-weight: 700; }

    .dz-toggle-row {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; border-bottom: 1.5px solid var(--dz-border);
    }
    .dz-toggle { position: relative; display: inline-block; width: 44px; height: 24px; }
    .dz-toggle input { opacity: 0; width: 0; height: 0; }
    .dz-toggle-track {
      position: absolute; cursor: pointer; inset: 0;
      background-color: var(--dz-border); transition: .3s; border-radius: 24px;
    }
    .dz-toggle-track:before {
      position: absolute; content: ""; height: 16px; width: 16px;
      left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%;
    }
    .dz-toggle input:checked + .dz-toggle-track { background-color: #8b5cf6; }
    .dz-toggle input:checked + .dz-toggle-track:before { transform: translateX(20px); }

    .wd-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      width: 100%; max-width: 400px; margin: 0 auto; padding: 16px; user-select: none;
    }
    .wd-hud {
      display: flex; justify-content: space-between; align-items: center; width: 100%;
      background: var(--dz-bg-card); border: 1px solid var(--dz-border);
      padding: 10px 18px; border-radius: var(--dz-radius-md); font-weight: 800; font-size: 13px;
    }
    .wd-word-display {
      font-size: 32px; font-weight: 800; letter-spacing: 4px; text-align: center;
      padding: 24px 16px; background: var(--dz-bg-card); border: 2px solid var(--dz-border);
      border-radius: var(--dz-radius-lg); width: 100%; min-height: 80px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace;
    }
    .wd-typed { color: #22c55e; }
    .wd-remaining { color: var(--dz-text-secondary); }
    .wd-wrong { color: #ef4444; text-decoration: underline; }
    .wd-input {
      width: 100%; padding: 14px 18px; border-radius: var(--dz-radius-md);
      border: 2px solid var(--dz-border); background: var(--dz-bg-card);
      color: var(--dz-text-primary); font-size: 18px; font-weight: 600;
      font-family: 'JetBrains Mono', monospace; outline: none; text-align: center;
    }
    .wd-input:focus { border-color: #8b5cf6; }
    .wd-timer-bar {
      width: 100%; height: 6px; background: var(--dz-border); border-radius: 3px; overflow: hidden;
    }
    .wd-timer-fill {
      height: 100%; background: linear-gradient(90deg, #22c55e, #fbbf24, #ef4444);
      transition: width 0.3s; border-radius: 3px;
    }
  </style>
</head>
<body>
<div class="dz-app">
  <header class="dz-topbar">
    <a class="dz-icon-btn" id="dz-back-hub" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="dz-logo" style="font-size:17px;">Word Duel</span>
    <div class="dz-topbar-actions">
      <button class="dz-icon-btn" id="dz-restart" type="button" aria-label="Restart">
        <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.08-5"/></svg>
      </button>
      <button class="dz-theme-toggle" id="themeToggle" type="button">
        <svg id="iconMoon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="iconSun" viewBox="0 0 24 24" style="display:none"><circle cx="12" cy="12" r="5"/></svg>
      </button>
    </div>
  </header>

  <div id="wd-setup">
    <div class="dz-setup-page dz-setup-wrap">
      <p class="dz-hero-eyebrow">Word Duel</p>
      <h2 class="dz-hero-heading">Speed Typing</h2>
      <p style="color:var(--dz-text-secondary);font-size:13px;margin-bottom:12px;">Type each word as fast as you can! Race the clock.</p>

      <div class="wd-section-title">Difficulty</div>
      <div class="wd-diff-cards">
        <div class="wd-diff-card" data-diff="easy">
          <span class="wd-diff-emoji">🐢</span>
          <span class="wd-diff-name">Easy</span>
        </div>
        <div class="wd-diff-card selected" data-diff="normal">
          <span class="wd-diff-emoji">⚡</span>
          <span class="wd-diff-name">Normal</span>
        </div>
        <div class="wd-diff-card" data-diff="hard">
          <span class="wd-diff-emoji">🔥</span>
          <span class="wd-diff-name">Expert</span>
        </div>
      </div>

      <div class="wd-section-title" style="margin-top:16px;">Settings</div>
      <div class="dz-toggle-row">
        <span style="font-size:14px;font-weight:600">Audio FX</span>
        <label class="dz-toggle">
          <input type="checkbox" checked id="wd-sound-toggle">
          <span class="dz-toggle-track"></span><span class="dz-toggle-thumb"></span>
        </label>
      </div>

      <button class="dz-btn dz-btn-primary" id="wd-start-btn" type="button"
              style="margin-top:20px;width:100%;border-radius:var(--dz-radius-xl);font-size:14px;font-weight:700;">
        START TYPING 📝
      </button>
    </div>
  </div>

  <div id="wd-play" class="hidden">
    <div id="wd-game-area"></div>
  </div>
</div>

<div id="dz-result-overlay">
  <div class="dz-result-page" style="max-width:320px;">
    <div class="dz-result-trophy">📝</div>
    <h2 class="dz-result-heading" id="dz-result-title">Results!</h2>
    <p class="dz-result-subtitle" id="dz-result-sub"></p>
    <div class="dz-result-actions">
      <button class="dz-btn dz-btn-primary" id="dz-result-again" type="button">TRY AGAIN</button>
      <button class="dz-btn dz-btn-secondary" id="dz-result-share" type="button">SHARE</button>
    </div>
    <a class="dz-see-all" href="index.html" style="margin-top:8px;display:block;">← Back to Hub</a>
  </div>
</div>

<script src="dz-games.js"></script>
<script src="dz-theme.js"></script>
<script src="dz-core.js"></script>
<script src="dz-game-shell.js"></script>
<script src="games/wordduel.js"></script>
<script src="dzshare.js"></script>

<script>
(function() {
  'use strict';
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.wd-diff-card').forEach(function(card) {
      card.addEventListener('click', function() {
        document.querySelectorAll('.wd-diff-card').forEach(function(c) { c.classList.remove('selected'); });
        card.classList.add('selected');
      });
    });

    var setup = document.getElementById('wd-setup');
    var play = document.getElementById('wd-play');
    var area = document.getElementById('wd-game-area');
    var instance = null;

    document.getElementById('wd-start-btn').addEventListener('click', function() {
      var diffCard = document.querySelector('.wd-diff-card.selected');
      var diff = diffCard ? diffCard.dataset.diff : 'normal';
      var sound = document.getElementById('wd-sound-toggle').checked;

      setup.classList.add('hidden');
      play.classList.remove('hidden');
      if (instance && instance.stop) instance.stop();

      setTimeout(function() {
        try {
          if (window.DZGames && window.DZGames['wordduel']) {
          instance = window.DZGames['wordduel']({
            container: area,
            difficulty: diff,
            sound: sound,
            onEnd: function(r) {
              if (typeof dzShowResult === 'function') {
                dzShowResult({
                  title: 'Time\'s Up!',
                  subtitle: r.subtitle || 'Word Duel Complete',
                  onAgain: function() {
                    if (typeof dzHideResult === 'function') dzHideResult();
                    play.classList.add('hidden');
                    setup.classList.remove('hidden');
                  }
                });
              }
            }
          });
          } else {
            area.innerHTML = '<div style="color:#ff4444; padding:20px; font-family:sans-serif; text-align:center;">Error: Game script not found or failed to load.</div>';
          }
        } catch (err) {
          area.innerHTML = '<div style="color:#ff4444; padding:20px; font-family:sans-serif; text-align:center;">Error: ' + err.message + '</div>';
        }
      }, 60);
    });

    document.getElementById('dz-restart').addEventListener('click', function() {
      if (instance && instance.stop) instance.stop();
      if (typeof dzHideResult === 'function') dzHideResult();
      play.classList.add('hidden');
      setup.classList.remove('hidden');
    });

    if (typeof dzInitGamePage === 'function') dzInitGamePage({});
  });
})();
</script>
</body>
</html>
